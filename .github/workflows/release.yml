name: release

# Publica el GitHub Release cuando se sube un tag vX.Y.Z (lo crea `npm run etiquetar`).
# Antes de publicar verifica que el tag coincida con la versión de los archivos, que el CHANGELOG tenga
# la sección y que las pruebas pasen. Corrida manual (workflow_dispatch): hace las mismas verificaciones
# y muestra las notas, pero no publica nada.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar versión
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Versiones, CHANGELOG y manifiestos
        env:
          TIPO_REF: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$TIPO_REF" = "tag" ]; then
            node scripts/verificar.mjs --tag "$TAG"
          else
            node scripts/verificar.mjs
          fi
      - name: Pruebas
        run: npm test
      - name: Notas de la versión
        run: node scripts/release.mjs notas "$(node scripts/release.mjs version)"

  publicar:
    name: Publicar release
    needs: verificar
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/release.mjs notas "${TAG#v}" > "$RUNNER_TEMP/notas.md"
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notas.md"
